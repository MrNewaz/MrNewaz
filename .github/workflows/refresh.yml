# Regenerates the profile banners and README: the Signals card gets fresh
# GitHub numbers every Monday, and calculated values (years of experience)
# roll over on their own. Can also be started by hand from the Actions tab.
name: Refresh profile README

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch GitHub signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/signals.py
      - run: python scripts/generate.py && python scripts/readme.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md img/lorecraft scripts/signals.json
          git diff --cached --quiet || git commit -m "Refresh profile signals ($(date +%Y-%m-%d))"
          git push
