# Regenerates the profile banners and README so calculated values (years of
# experience, the © year) roll over on their own. Runs every 1 January and
# can be started by hand from the Actions tab.
name: Refresh profile README

on:
  schedule:
    - cron: "0 0 1 1 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/generate.py && python scripts/readme.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md img/lorecraft
          git diff --cached --quiet || git commit -m "Refresh profile README for $(date +%Y)"
          git push
